<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="55%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F0C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#122B1E"/>
      <stop offset="50%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#122B1E"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="220" rx="12" fill="#0B0F0C"/>

  <ellipse cx="400" cy="110" rx="360" ry="100" fill="url(#greenGlow)"/>

  <rect x="1" y="1" width="798" height="218" rx="11" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6"/>

  <line x1="260" y1="152" x2="540" y2="152" stroke="#00FF66" stroke-width="2" stroke-linecap="round" opacity="0.8" filter="url(#glowFilter)"/>

  <text x="400" y="122" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="2" 
        filter="url(#glowFilter)">
    Users-Pro.v2.2.0
  </text>
</svg>
